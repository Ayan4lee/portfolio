<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Projects | Mushtaque Ali</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/assets/css/style.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head><body class="admin-shell"><div class="container-fluid"><div class="row"><aside class="col-lg-2 admin-sidebar"><a class="brand mb-4" href="/"><span class="brand-mark">&lt;/&gt;</span>Portfolio</a><div class="small text-uppercase mb-2" style="color:#87aaa2;letter-spacing:.12em">Workspace</div><a href="/admin/index.html">▦　Overview</a><a class="active" href="/admin/projects.html">▤　Projects</a><a href="/admin/skills.html">◇　Skills</a><a href="/admin/education.html">Education</a><a href="/admin/achievements.html">★　Achievements</a><a href="/admin/certificates.html">✎　Certificates</a><a href="/admin/experience.html">◆　Experience</a><a href="/admin/messages.html">✉　Messages</a><a href="/" target="_blank" rel="noopener">↗　View Website</a><button class="btn btn-outline-light btn-sm w-100 mt-4" id="logoutButton">Sign Out</button></aside><main class="col-lg-10 admin-main"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><div class="section-kicker">Content management</div><h1 class="h2 mb-1">Projects</h1><p class="mb-0" style="color:var(--muted)">Create, update, publish or remove portfolio projects.</p></div><button class="btn btn-teal" id="newProjectButton">+ New Project</button></div><div id="adminAlert" aria-live="polite"></div><div class="content-card"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><h2 class="h5 mb-0">All projects</h2><input id="adminSearch" class="form-control" style="max-width:260px" placeholder="Search projects…" aria-label="Search admin projects"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Project</th><th>Category</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="adminProjectsTable"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></main></div></div>
<div class="modal fade" id="projectFormModal" tabindex="-1" aria-labelledby="projectFormTitle" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><form id="projectForm"><div class="modal-header"><h2 class="modal-title h5" id="projectFormTitle">Add project</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div id="projectFormAlert"></div><input type="hidden" id="projectId"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="pTitle">Title *</label><input class="form-control" id="pTitle" required minlength="3" maxlength="120"></div><div class="col-md-6"><label class="form-label" for="pCategory">Category ID</label><input class="form-control" id="pCategory" type="number" min="1" placeholder="1 = Web, see Supabase categories table"></div><div class="col-12"><label class="form-label" for="pSummary">Summary *</label><input class="form-control" id="pSummary" required minlength="10" maxlength="220"></div><div class="col-12"><label class="form-label" for="pDescription">Description *</label><textarea class="form-control" id="pDescription" rows="4" required minlength="20" maxlength="5000"></textarea></div><div class="col-md-6"><label class="form-label" for="pTech">Technologies</label><input class="form-control" id="pTech" placeholder="HTML, CSS, JavaScript"></div><div class="col-md-6"><label class="form-label" for="pDate">Project date</label><input class="form-control" id="pDate" type="date"></div><div class="col-md-6"><label class="form-label" for="pStatus">Status</label><input class="form-control" id="pStatus" maxlength="60" placeholder="Completed, Completed prototype…"></div><div class="col-md-6"><label class="form-label" for="pRole">Role</label><input class="form-control" id="pRole" maxlength="120" placeholder="Team project — Team Lead"></div><div class="col-12"><label class="form-label" for="pFeatures">Features (one per line)</label><textarea class="form-control" id="pFeatures" rows="4"></textarea></div><div class="col-12"><label class="form-label" for="pImageFile">Upload image (PNG, JPG, WEBP · max 3 MB)</label><input class="form-control" id="pImageFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="form-text" id="pImageHelp"></div></div><div class="col-12"><label class="form-label" for="pImage">Image URL</label><input class="form-control" id="pImage" type="url" placeholder="https://…"></div><div class="col-md-6"><label class="form-label" for="pLive">Live URL</label><input class="form-control" id="pLive" type="url" placeholder="https://…"></div><div class="col-md-6"><label class="form-label" for="pRepo">Repository URL</label><input class="form-control" id="pRepo" type="url" placeholder="https://…"></div><div class="col-md-6"><label class="form-label" for="pOrder">Display order</label><input class="form-control" id="pOrder" type="number" value="0"></div><div class="col-md-6 d-flex align-items-end gap-4 pb-2"><label class="form-check"><input class="form-check-input" id="pFeatured" type="checkbox"><span class="form-check-label">Featured</span></label><label class="form-check"><input class="form-check-input" id="pPublished" type="checkbox"><span class="form-check-label">Published</span></label></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-teal" id="saveProjectButton">Save Project</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="/assets/js/main.js"></script><script src="/assets/js/admin.js"></script></body></html>
